<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 12: Table with Headers,Caption and Footer</title>
</head>
<body>
    <table border="1">
        <p>Student Marks</p>
        <header>
            <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </header>
        <caption>
            <tr>
                <td>1</td>
                <td>Aman</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </caption>
        <footer>
            <tr>
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </footer>
    </table>
</body>
</html>
