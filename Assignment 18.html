<!DOCTYPE html>
<html lang="en">

<body>
    <h1 align="center">ABC College Admission 2026</h1>

                <th>Seats</th>
                <th>Fees</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>

            </tr>
            <tr>
                <td>BCA</td>

                <td>&#8377; 45000</td>

        <select name="course" id="course">
            <option value="B.Tech CSE">B.Tech CSE</option>
            <option value="BCA">BCA</option>
        </select>
        <br><br>

         <label for="statement">statement:</label>
         <br>

        <br><br>

        <button>Apply</button>
    </fieldset>
    <hr>

    </footer>
    
</body>
